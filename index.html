<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080b12">
  <meta name="description" content="Stop the moving pixel as close to the target as you can. Ten taps. One daily challenge.">
  <title>Pixel Brake Zero — Daily precision game</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23080b12'/%3E%3Crect x='29' y='8' width='6' height='48' rx='3' fill='%236ee7ff'/%3E%3Ccircle cx='32' cy='32' r='11' fill='none' stroke='%23ffcf5a' stroke-width='5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Pixel Brake Zero home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>PIXEL BRAKE ZERO</span>
      </a>
      <div class="header-actions">
        <button class="icon-button" id="soundButton" type="button" aria-label="Toggle sound" aria-pressed="true">♪</button>
        <button class="lang-button" id="langButton" type="button">ES</button>
      </div>
    </header>

    <section class="game-card" aria-live="polite">
      <div class="round-row">
        <span id="modeLabel">DAILY RUN</span>
        <span><strong id="roundNumber">1</strong>/10</span>
      </div>

      <div class="score-row">
        <div>
          <span class="score-label" id="scoreLabel">SCORE</span>
          <strong id="score">0</strong>
        </div>
        <div class="best-wrap">
          <span class="score-label" id="bestLabel">BEST</span>
          <strong id="best">—</strong>
        </div>
      </div>

      <div class="arena" id="arena" role="button" tabindex="0" aria-label="Tap to stop the moving pixel">
        <div class="target" id="target" aria-hidden="true"></div>
        <div class="runner" id="runner" aria-hidden="true"></div>
        <div class="tap-hint" id="tapHint">TAP ANYWHERE</div>
      </div>

      <div class="feedback" id="feedback">
        <strong id="feedbackTitle">Get as close as possible.</strong>
        <span id="feedbackDetail">Perfect hit = 1,000 points</span>
      </div>

      <div class="progress" id="progress" aria-label="Round progress"></div>

      <button class="primary-button" id="startButton" type="button">START DAILY RUN</button>
    </section>

    <section class="result-card hidden" id="resultCard">
      <span class="eyebrow" id="resultEyebrow">TODAY'S RESULT</span>
      <h1><span id="finalScore">0</span><small>/10,000</small></h1>
      <p id="resultMessage">Steady hands.</p>
      <div class="result-grid" id="resultGrid" aria-label="Results by round"></div>
      <button class="primary-button" id="shareButton" type="button">SHARE RESULT</button>
      <button class="secondary-button" id="practiceButton" type="button">PRACTICE MODE</button>
      <p class="next-puzzle" id="nextPuzzle"></p>
    </section>

    <footer>
      <p id="footerText">No account. No download. The same challenge for everyone today.</p>
      <nav aria-label="Information">
        <button type="button" id="howButton">How to play</button>
        <button type="button" id="privacyButton">Privacy</button>
      </nav>
    </footer>
  </main>

  <dialog id="infoDialog">
    <button class="dialog-close" id="dialogClose" type="button" aria-label="Close">×</button>
    <div id="dialogContent"></div>
  </dialog>

  <script src="game.js"></script>
</body>
</html>
